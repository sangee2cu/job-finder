<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Finder</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f6f8fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:28px 20px 60px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.hero h1{margin:0 0 6px;font-size:32px}.hero p{margin:0;color:#667085}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;text-decoration:none;cursor:pointer;background:#1f6feb;color:#fff}.btn.secondary{background:#e8edf5;color:#172033}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{background:#fff;border:1px solid #e3e8f0;border-radius:14px;padding:16px}.stat b{display:block;font-size:25px}.filters{background:#fff;border:1px solid #e3e8f0;border-radius:14px;padding:16px;margin-bottom:18px;display:grid;grid-template-columns:1.5fr 1.5fr 1fr 1fr;gap:12px}.filters label{font-size:12px;font-weight:700;color:#667085;display:block;margin-bottom:5px}.filters input,.filters select{width:100%;padding:10px;border:1px solid #d5dce7;border-radius:9px;background:#fff}.job{background:#fff;border:1px solid #e3e8f0;border-radius:14px;padding:18px;margin-bottom:12px;display:grid;grid-template-columns:90px 1fr auto;gap:18px;align-items:center}.score{font-size:24px;font-weight:800}.score small{display:block;font-size:11px;color:#667085}.job h2{font-size:18px;margin:0 0 6px}.meta{color:#667085;font-size:14px}.why{font-size:13px;color:#475467;margin-top:8px}.apply{background:#16834a;color:#fff}.tag{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eef2f7}.empty{text-align:center;padding:45px;background:#fff;border:1px dashed #cbd5e1;border-radius:14px;color:#667085}.note{font-size:12px;color:#667085;margin-top:18px}@media(max-width:800px){.hero{display:block}.actions{margin-top:15px}.stats{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.job{grid-template-columns:70px 1fr}.job .applybox{grid-column:1/-1}}@media(max-width:520px){.filters{grid-template-columns:1fr}.job{grid-template-columns:1fr}.score{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero"><div><h1>💼 Job Finder</h1><p>Resume-aware U.S. search · Raleigh · Durham · Cary · Austin · Nashville · U.S. Remote</p></div><div class="actions"><a class="btn" href="https://github.com/sangee2cu/job-finder/actions/workflows/job-finder.yml" target="_blank">🔎 Run Job Finder</a><button class="btn secondary" onclick="loadJobs()">↻ Refresh</button></div></header>
<section class="stats"><div class="stat"><b id="count">0</b>Matching jobs</div><div class="stat"><b id="strong">0</b>Strong matches</div><div class="stat"><b id="updated">—</b>Last updated</div></section>
<section class="filters"><div><label>Search</label><input id="search" placeholder="Role, company, skill..." oninput="render()"></div><div><label>Location</label><select id="location" onchange="render()"><option value="">All locations</option></select></div><div><label>Minimum score</label><select id="score" onchange="render()"><option>70</option><option>75</option><option selected>80</option><option>85</option><option>90</option><option>95</option></select></div><div><label>Recommendation</label><select id="action" onchange="render()"><option value="">All</option><option>APPLY</option><option>REVIEW</option><option>STRETCH</option></select></div></section>
<main id="jobs"></main><div class="note">Easy Apply opens the employer's application page. Applications are never submitted automatically.</div>
</div>
<script>
let data={jobs:[]};
async function loadJobs(){try{const r=await fetch('jobs.json?t='+Date.now());data=await r.json();buildLocations();render()}catch(e){document.getElementById('jobs').innerHTML='<div class="empty">Unable to load job data. Run the Job Finder workflow first.</div>'}}
function buildLocations(){const s=document.getElementById('location');const vals=[...new Set(data.jobs.map(j=>j.location).filter(Boolean))].sort();s.innerHTML='<option value="">All locations</option>'+vals.map(v=>`<option>${esc(v)}</option>`).join('')}
function render(){const q=document.getElementById('search').value.toLowerCase();const loc=document.getElementById('location').value;const min=+document.getElementById('score').value;const act=document.getElementById('action').value;const jobs=data.jobs.filter(j=>(!q||[j.title,j.company,j.location,j.description,j.explanation].join(' ').toLowerCase().includes(q))&&(!loc||j.location===loc)&&j.score>=min&&(!act||j.recommendation===act));document.getElementById('count').textContent=jobs.length;document.getElementById('strong').textContent=jobs.filter(j=>j.score>=85).length;document.getElementById('updated').textContent=data.generated_at?new Date(data.generated_at).toLocaleDateString(): '—';document.getElementById('jobs').innerHTML=jobs.length?jobs.map(j=>`<article class="job"><div class="score">${j.score}<small>/100</small></div><div><h2>${esc(j.title)}</h2><div class="meta"><b>${esc(j.company)}</b> · ${esc(j.location||'U.S.')}</div><span class="tag">${esc(j.recommendation)}</span><div class="why">${esc(j.explanation||'Resume match available')}</div></div><div class="applybox"><a class="btn apply" href="${esc(j.url)}" target="_blank" rel="noopener">🚀 Easy Apply</a></div></article>`).join(''):'<div class="empty">No jobs match these filters. Try a lower score or click <b>Run Job Finder</b>.</div>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
loadJobs();
</script>
</body>
</html>
