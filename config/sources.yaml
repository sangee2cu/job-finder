# Public ATS sources monitored by the agent.
# These use public Greenhouse/Lever posting endpoints plus best-effort Indeed search.

greenhouse:
  - company: Cloudflare
    board_token: cloudflare
  - company: Datadog
    board_token: datadog
  - company: Coinbase
    board_token: coinbase

lever: []

# Indeed public search pages. Keep queries focused to avoid noisy results.
indeed:
  - query: "Senior Engineering Manager"
    location: "Raleigh, NC"
    limit: 25
  - query: "Director Engineering"
    location: "Raleigh, NC"
    limit: 25
  - query: "AI Engineering Manager"
    location: "Raleigh, NC"
    limit: 25
  - query: "Platform Engineering Manager"
    location: "Raleigh, NC"
    limit: 25
  - query: "Senior Engineering Manager"
    location: "Remote"
    limit: 25
  - query: "AI Engineering Manager"
    location: "Remote"
    limit: 25
  - query: "Director Engineering"
    location: "Remote"
    limit: 25
  - query: "Cloud Infrastructure Engineering Manager"
    location: "Remote"
    limit: 25
  - query: "Senior Engineering Manager"
    location: "Austin, TX"
