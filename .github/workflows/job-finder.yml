name: Job Finder

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1-5'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore job history
        uses: actions/cache@v4
        with:
          path: data/jobs.db
          key: job-finder-db-${{ github.run_id }}
          restore-keys: |
            job-finder-db-

      - name: Discover and rank jobs
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: 587
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m job_finder

      - name: Publish ranked report
        uses: actions/upload-artifact@v4
        with:
          name: job-finder-report
          path: reports/latest.md
          if-no-files-found: error
          retention-days: 14
